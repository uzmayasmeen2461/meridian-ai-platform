name: Meridian AI CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend
        run: python -m pip install -e "backend[test]"

      - name: Run backend, MCP, and provisioning tests
        run: python -m pytest backend

      - name: Bootstrap CI database
        run: python -m app.cli bootstrap --db-url sqlite:///backend/ci-meridian.db --starter-kit starter-kit

      - name: Validate provisioning render
        run: |
          python -m app.cli provision \
            --actor-user-id user_533B58E6F66C98ACB833527A \
            --db-url sqlite:///backend/ci-meridian.db \
            --starter-kit starter-kit \
            --output-dir /tmp/meridian-provisioning

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        run: npm ci
        working-directory: frontend

      - name: Run frontend tests
        run: npm test
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend
